<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="X-Frame-Options" content="DENY" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=()" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://tailwindcss.com; style-src 'self' 'unsafe-inline' https://googleapis.com; font-src 'self' https://gstatic.com; img-src 'self' data:; connect-src 'self' https://*.workers.dev; base-uri 'self'; form-action 'self';" />
  <title>TrainAI Uganda — Secure Workspace</title>
  <script src="https://tailwindcss.com"></script>
  <link rel="preconnect" href="https://googleapis.com" crossorigin>
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            obsidian: {
              950: '#07090E',
              900: '#0D111A',
              850: '#131926',
              800: '#1A2233',
              border: '#252F45'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #07090E;
      color: #F8FAFC;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-image: radial-gradient(circle at 15% 0%, rgba(59, 130, 246, 0.08), transparent 35%),
                        radial-gradient(circle at 85% 100%, rgba(16, 185, 129, 0.06), transparent 35%);
    }
    .glass-panel {
      background: rgba(13, 17, 26, 0.85);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #07090E; }
    ::-webkit-scrollbar-thumb { background: #252F45; border-radius: 4px; }
  </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row antialiased selection:bg-indigo-500/30 selection:text-indigo-200">

  <!-- DESKTOP SIDEBAR -->
  <aside class="hidden md:flex md:w-68 md:flex-col md:fixed md:inset-y-0 glass-panel border-r border-obsidian-border z-20">
    <div class="flex items-center justify-between px-6 h-16 border-b border-obsidian-border">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-indigo-500 via-blue-600 to-emerald-500 flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/25">
          T
        </div>
        <div>
          <span class="font-bold text-base tracking-tight text-white">TrainAI</span>
          <span class="text-[10px] font-mono uppercase tracking-wider text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-1.5 py-0.5 rounded ml-1">UG</span>
        </div>
      </div>
      <span title="TLS + Strict CSP Active" class="w-2 h-2 rounded-full bg-emerald-400 shadow-[0_0_8px_#10b981]"></span>
    </div>

    <nav class="flex-1 px-4 py-6 space-y-1.5">
      <button data-tab="dashboard" class="nav-btn w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium bg-indigo-500/15 text-indigo-300 border border-indigo-500/30 transition cursor-pointer">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
        Dashboard
      </button>

      <button data-tab="statements" class="nav-btn w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:text-white hover:bg-obsidian-800 transition cursor-pointer">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        Statements
      </button>

      <button id="sidebar-chat-btn" class="w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:text-white hover:bg-obsidian-800 transition cursor-pointer">
        <div class="flex items-center gap-3">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg>
          Encrypted Support
        </div>
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
      </button>
    </nav>

    <!-- Security & Trust Shield Widget -->
    <div class="p-4 m-4 rounded-xl bg-obsidian-850 border border-obsidian-border space-y-3">
      <div class="flex items-center justify-between">
        <span class="text-[11px] font-mono uppercase tracking-wider text-slate-400">Session Shield</span>
        <span class="text-[11px] font-mono text-emerald-400 flex items-center gap-1">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
          ACTIVE
        </span>
      </div>
      <div class="text-[11px] text-slate-400 font-mono bg-obsidian-950 px-2.5 py-1.5 rounded-lg border border-obsidian-border truncate" id="session-fingerprint">
        ID: Initializing...
      </div>
      <div>
        <div class="flex justify-between text-xs mb-1">
          <span class="text-slate-400">Task Accuracy</span>
          <span class="text-indigo-400 font-semibold">96%</span>
        </div>
        <div class="w-full bg-obsidian-950 rounded-full h-1.5">
          <div class="bg-gradient-to-r from-indigo-500 to-emerald-400 h-1.5 rounded-full" style="width: 96%"></div>
        </div>
      </div>
    </div>
  </aside>

  <!-- MOBILE HEADER -->
  <header class="md:hidden flex items-center justify-between px-4 h-14 glass-panel border-b border-obsidian-border sticky top-0 z-20">
    <div class="flex items-center gap-2.5">
      <div class="w-7 h-7 rounded-lg bg-gradient-to-br from-indigo-500 to-emerald-500 flex items-center justify-center font-bold text-white text-sm">T</div>
      <span class="font-bold text-white">TrainAI.ug</span>
    </div>
    <span class="text-[11px] font-mono bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2.5 py-0.5 rounded-full">
      E2E PROTECTED
    </span>
  </header>

  <!-- MAIN CONTENT -->
  <main class="flex-1 md:pl-68 pb-24 md:pb-12">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 md:pt-8">

      <!-- TOP BAR -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
        <div>
          <h1 id="page-title" class="text-2xl font-bold text-white tracking-tight">Dashboard</h1>
          <p id="page-subtitle" class="text-sm text-slate-400 mt-0.5">Verified AI feedback workspace & UGX reward settlement.</p>
        </div>
        <button id="open-withdraw-btn" class="inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white text-sm font-semibold shadow-lg shadow-emerald-600/20 transition cursor-pointer">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
          Withdraw to MoMo / Airtel
        </button>
      </div>

      <!-- ========================================== -->
      <!-- DASHBOARD VIEW                             -->
      <!-- ========================================== -->
      <section id="view-dashboard" class="space-y-8">
        
        <!-- Balance Cards -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <div class="p-6 rounded-2xl bg-obsidian-900 border border-obsidian-border relative overflow-hidden">
            <div class="flex items-center justify-between mb-3">
              <span class="text-[11px] font-mono uppercase tracking-wider text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-2.5 py-1 rounded-md">Cleared & Withdrawable</span>
              <span class="text-xs text-slate-400 font-mono">UGX WALLET</span>
            </div>
            <div class="flex items-baseline gap-2 my-2">
              <span class="text-3xl sm:text-4xl font-bold text-white tracking-tight">14,500</span>
              <span class="text-sm font-mono text-slate-400">UGX</span>
            </div>
            <p class="text-xs text-slate-400 mt-3 flex items-center gap-1.5">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
              Ready for instant MTN MoMo or Airtel Money payout.
            </p>
          </div>

          <div class="p-6 rounded-2xl bg-obsidian-900 border border-obsidian-border">
